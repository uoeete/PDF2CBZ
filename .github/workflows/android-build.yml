name: Build PDF2CBZ APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x PDF2CBZ-Android/gradlew
          cd PDF2CBZ-Android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF2CBZ-APK
          path: PDF2CBZ-Android/app/build/outputs/apk/debug/*.apk
